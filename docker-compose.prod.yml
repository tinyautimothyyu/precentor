# Production stack: Postgres + Django (gunicorn) + Next.js (built) behind Caddy.
#
#   cp .env.prod.example .env.prod   # fill in real values
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
#
# Everything is served from one origin (https://$DOMAIN). Caddy terminates TLS
# (automatic Let's Encrypt certs) and routes /api, /admin, /healthz to Django,
# /static to collected static files, and everything else to Next.js.
# For local dev use docker-compose.yml instead.

# Separate project name so containers/volumes never collide with the dev stack.
name: precentor-prod

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: precentor
      POSTGRES_USER: precentor
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.prod}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # No published ports: only reachable from other services on this network.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U precentor"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: ./backend
    restart: unless-stopped
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             exec gunicorn precentor.wsgi:application --bind 0.0.0.0:8000 --workers 3 --access-logfile -"
    # Optional passthrough vars (USE_S3, AWS_*, YOUTUBE_API_KEY, TIME_ZONE).
    env_file: .env.prod
    environment:
      DJANGO_SETTINGS_MODULE: precentor.settings.prod
      DEBUG: "false"
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in .env.prod}
      DATABASE_URL: postgres://precentor:${POSTGRES_PASSWORD}@db:5432/precentor
      ALLOWED_HOSTS: ${DOMAIN:?set DOMAIN in .env.prod}
      CORS_ALLOWED_ORIGINS: https://${DOMAIN}
    volumes:
      - static:/app/staticfiles
      - media:/app/media   # sheet files when USE_S3=false (never served publicly)
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        # Baked into the client bundle at build time; rebuild if DOMAIN changes.
        NEXT_PUBLIC_API_BASE: https://${DOMAIN}
    restart: unless-stopped
    depends_on:
      - web

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - static:/srv/static:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
      - frontend

volumes:
  pgdata:
  media:
  static:
  caddy_data:
  caddy_config:
