services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: precentor
      POSTGRES_USER: precentor
      POSTGRES_PASSWORD: precentor
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U precentor"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: ./backend
    command: >
      sh -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"
    volumes:
      - ./backend:/app
      - media:/app/media
    ports:
      - "8000:8000"
    environment:
      DJANGO_SETTINGS_MODULE: precentor.settings.dev
      DATABASE_URL: postgres://precentor:precentor@db:5432/precentor
      SECRET_KEY: insecure-dev-key-change-me
      DEBUG: "true"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  media:
